name: CI

on:
  push:
    branches:
      - main
      - master
      - feat/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (${{ matrix.os }})
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run test:coverage' || 'npm test' }}

      - name: Build app
        run: npm run build

  package:
    name: package (${{ matrix.os }})
    # 仅打 tag（v*）时产出安装包；日常 CI 只做四门验证，避免每次 push 都跑耗时的原生打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 原生二进制（ffmpeg-static / onnxruntime-node）随安装平台下载，必须在本平台 runner 打包
      - name: Package
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
      - master
      - feat/**
    # 打 tag 必须显式声明，否则 push.tags 不触发 workflow，package job 永远 skipped
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (${{ matrix.os }})
        run: ${{ matrix.os == 'ubuntu-latest' && 'npm run test:coverage' || 'npm test' }}

      - name: Build app
        run: npm run build

  e2e-smoke:
    name: e2e smoke (windows)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright 的 Electron 驱动读取 out/ 产物，必须先构建
      - name: Build app
        run: npm run build

      - name: Electron smoke
        run: npx playwright test --config=e2e/playwright.config.ts e2e/smoke.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-screenshot
          path: e2e/smoke-window.png
          retention-days: 7
          if-no-files-found: warn

  package:
    name: package (${{ matrix.os }})
    # 仅打 tag（v*）时产出安装包；日常 CI 只做四门验证，避免每次 push 都跑耗时的原生打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 原生二进制（ffmpeg-static / onnxruntime-node）随安装平台下载，必须在本平台 runner 打包
      - name: Package (windows / linux)
        if: matrix.os != 'macos-latest'
        run: npm run ${{ matrix.script }}

      # macOS：配置了 Apple 凭证时自动开启公证；未配置时跳过公证但仍产出可用安装包
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            npx electron-builder --mac --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true

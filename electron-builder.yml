appId: com.dramastudio.app
productName: 本地AI短剧工坊
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# 应用图标（build/icon.png）
icon: build/icon.png

# 应用包内容：electron-vite 构建产物 + 生产依赖
files:
  - out/**
  - package.json

# ffmpeg/ffprobe 二进制在 asar 内不可执行，必须解包到 app.asar.unpacked
# （ffmpegService.unpackedPath 已做 app.asar -> app.asar.unpacked 路径映射）
# onnxruntime-node 同理：onnxruntime_binding.node / onnxruntime.dll / DirectML.dll 是原生
# 模块，require 时无法从 asar 内 dlopen（ERR_DLOPEN_FAILED）。faceDetector.ts 已按
# "打包后在 app.asar.unpacked 内解析" 写死，这里必须同步解包，否则人脸检测/一致性比对
# 在打包版直接不可用（dev 下走普通 node_modules 不受影响，故此前未暴露）。
# @huggingface/transformers（CLIP 全图回退）依赖 sharp 解码图像：sharp 的
# libvips 原生库与 @img/* 平台包同样不能从 asar 内加载，必须一并解包。
# 顶层 onnxruntime-node 升到 1.31.1 后，transformers 3.8.1 仍精确锁 onnxruntime-node 1.21.0，
# npm 会在其下装出嵌套副本；CLIP 路径经 transformers 解析到嵌套副本，其原生库同样必须解包
# （顶层与嵌套两条都列，避免依赖 npm 提升策略变化后漏解包）。
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/onnxruntime-node/**
  - node_modules/@huggingface/transformers/node_modules/onnxruntime-node/**
  # sharp 由 transformers 作为传递依赖安装，npm 未提升到顶层 → 实际路径是嵌套的；
  # 两条都保留，避免依赖 npm 提升策略变化后漏解包。
  - node_modules/sharp/**
  - node_modules/@huggingface/transformers/node_modules/sharp/**
  - node_modules/@img/**

# 工作流 JSON 随 resources 分发
# （main/index.ts: app.isPackaged 时读取 process.resourcesPath/workflows）
extraResources:
  - from: workflows
    to: workflows
    filter:
      - "**/*.json"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
  # P1-4 代码签名骨架：证书不入仓，由 CI secrets 注入
  #   CSC_LINK          pfx 证书（base64 或绝对路径）
  #   CSC_KEY_PASSWORD  证书口令
  # 未配置 secrets 时 electron-builder 自动跳过签名（产物可用，但 Windows SmartScreen 会提示"未知发布者"）。
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 本地AI短剧工坊

# macOS：需在 macOS 主机/CI runner 上打包（ffmpeg-static 与 onnxruntime-node 为平台原生二进制，
# 跨平台交叉打包不可用；本机 Windows 无法验证 mac 产物）
mac:
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.video
  # ENG-04 macOS 签名与公证骨架：
  #   - hardenedRuntime 必须开启，否则公证直接失败
  #   - entitlements 覆盖 JIT / 可执行内存 / 库校验 / DYLD（ffmpeg、onnxruntime、子进程需要）
  #   - 公证默认关闭：无 Apple 凭证时开启会让打包直接失败。CI 在检测到
  #     APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID secrets 时
  #     追加 -c.mac.notarize=true 打开（见 .github/workflows/ci.yml）
  #   - 签名证书仍走 CSC_LINK / CSC_KEY_PASSWORD（与 Windows 共用机制）
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

# Linux：需在 Linux 主机/CI runner 上打包（同上，原生二进制不可跨平台）
linux:
  target:
    - target: AppImage
    - target: deb
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: AudioVideo
  maintainer: drama-studio

# 生产依赖未打包进 asar 时 electron-builder 会自动处理；
# 以下为主进程运行时必需的外部原生/二进制相关包
npmRebuild: false
